<!-- ═══════════════════════════════════════════════════════════
     NEWS TAB — Clinical Nutrition Feed
     Powered by oasis-nutrition-api (local Django server)
     Add this block after </div><!-- end tab-reference -->
     ═══════════════════════════════════════════════════════════ -->
<div class="main" id="tab-news" style="padding:0">
<div style="max-width:760px;margin:0 auto;padding:16px 14px 80px">

  <!-- ── Header ── -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
    <div>
      <div style="font-family:var(--cond);font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:2px">Oasis</div>
      <div style="font-family:var(--cond);font-size:22px;font-weight:800;color:var(--text-bright);line-height:1">NUTRITION NEWS</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="on-crawl-btn"
        onclick="OasisNews.triggerCrawl()"
        style="font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;padding:7px 12px;border-radius:7px;border:1px solid rgba(29,233,212,0.3);background:rgba(29,233,212,0.07);color:var(--teal);cursor:pointer;white-space:nowrap;text-transform:uppercase">
        Crawl now
      </button>
      <button id="on-refresh-btn"
        onclick="OasisNews.refresh()"
        aria-label="Refresh feed"
        style="font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);cursor:pointer">
        ↺
      </button>
    </div>
  </div>

  <!-- ── Stats bar ── -->
  <div id="on-stats-bar"
    style="font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-bottom:14px;min-height:16px">
  </div>

  <!-- ── Search ── -->
  <div style="position:relative;margin-bottom:14px">
    <svg style="position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="on-search-input"
      type="search"
      placeholder="Search articles…"
      autocomplete="off"
      spellcheck="false"
      style="width:100%;box-sizing:border-box;padding:9px 12px 9px 32px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);font-family:var(--mono);font-size:12px;color:var(--text);outline:none;-webkit-appearance:none">
  </div>

  <!-- ── Region filter chips ── -->
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
    <button class="on-filter-chip on-chip-active" data-type="region" data-value=""
      onclick="OasisNews.switchFilter('region','',this)">All</button>
    <button class="on-filter-chip" data-type="region" data-value="malawi"
      onclick="OasisNews.switchFilter('region','malawi',this)">🇲🇼 Malawi</button>
    <button class="on-filter-chip" data-type="region" data-value="africa"
      onclick="OasisNews.switchFilter('region','africa',this)">Africa</button>
    <button class="on-filter-chip" data-type="region" data-value="global"
      onclick="OasisNews.switchFilter('region','global',this)">Global</button>
  </div>

  <!-- ── Category filter chips ── -->
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
    <button class="on-filter-chip on-chip-active" data-type="category" data-value=""
      onclick="OasisNews.switchFilter('category','',this)">All topics</button>
    <button class="on-filter-chip" data-type="category" data-value="clinical_nutrition"
      onclick="OasisNews.switchFilter('category','clinical_nutrition',this)">Clinical</button>
    <button class="on-filter-chip" data-type="category" data-value="research"
      onclick="OasisNews.switchFilter('category','research',this)">Research</button>
    <button class="on-filter-chip" data-type="category" data-value="pediatric"
      onclick="OasisNews.switchFilter('category','pediatric',this)">Pediatric</button>
    <button class="on-filter-chip" data-type="category" data-value="malnutrition"
      onclick="OasisNews.switchFilter('category','malnutrition',this)">Malnutrition</button>
    <button class="on-filter-chip" data-type="category" data-value="public_health"
      onclick="OasisNews.switchFilter('category','public_health',this)">Public Health</button>
    <button class="on-filter-chip" data-type="category" data-value="policy"
      onclick="OasisNews.switchFilter('category','policy',this)">Policy</button>
  </div>

  <!-- ── Article list ── -->
  <div id="on-article-list"></div>

</div>
</div>
<!-- ════════════ END NEWS TAB ════════════ -->
